'use strict';let config=window.__PUBLIC__,state=JSON.parse(localStorage.getItem('mta-state-v2')||'null')||{wallet:100,players:[{icon:0}]},dealerTimer,slotState=null,bj={},hl={};const $=s=>document.querySelector(s),sleep=ms=>new Promise(r=>setTimeout(r,ms));
function saveState(){localStorage.setItem('mta-state-v2',JSON.stringify(state));renderWallet()}function renderWallet(){normalizePlayers();$('#wallet').textContent=state.wallet;let pc=$('#pcount');if(pc)pc.value=state.players.length;renderPlayers()}function normalizePlayers(){state.players.forEach((p,i)=>{if(p.icon==null)p.icon=i%config.characters.length})}function setPlayers(n){while(state.players.length<n)state.players.push({icon:state.players.length%config.characters.length});state.players=state.players.slice(0,n);saveState()}function resetWallet(){state.wallet=100;saveState()}function choosePlayerIcon(pi,ci){state.players[pi].icon=ci;saveState()}function renderPlayers(){let el=$('#players');if(!el)return;el.innerHTML=state.players.map((p,i)=>`<div style="margin-top:7px"><b>${state.players.length===1?'あなた':'プレイヤー'+(i+1)}</b>　${config.characters.map((c,j)=>`<button class="btn ${p.icon===j?'gold':'alt'}" style="padding:5px" onclick="choosePlayerIcon(${i},${j})">${charVisual(j,'40px')}</button>`).join('')}</div>`).join('')}
function charVisual(i,size='48px'){let c=config.characters[i%config.characters.length]||{};return c.image?`<img src="${c.image}" alt="${esc(c.name)}" draggable="false" style="width:${size};height:${size};object-fit:contain;vertical-align:middle">`:(c.emoji||'❓')}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

let raceMarket=null;
function racePickCount(type){return type==='win'?1:type==='exacta'||type==='quinella'?2:3}
function raceOrderedProbability(weights,picks){let remaining=weights.reduce((a,b)=>a+b,0),prob=1;for(let i of picks){if(!weights[i]||remaining<=0)return 0;prob*=weights[i]/remaining;remaining-=weights[i]}return prob}
function racePermutations(a){if(a.length===0)return [[]];return a.flatMap((v,i)=>racePermutations(a.filter((_,j)=>j!==i)).map(t=>[v,...t]))}
function raceQuote(weights,type,picks){if(picks.length!==racePickCount(type)||new Set(picks).size!==picks.length)return 0;let unordered=type==='quinella'||type==='trio',prob=unordered?racePermutations(picks).reduce((sum,seq)=>sum+raceOrderedProbability(weights,seq),0):raceOrderedProbability(weights,picks);return prob>0?Math.max(1,Math.floor(10/prob)/10):0}
function raceWeightedOrder(entrants,weights){let left=entrants.slice(),order=[];while(left.length){let total=left.reduce((sum,i)=>sum+weights[i],0),r=Math.random()*total,k=left.length-1;for(let j=0;j<left.length;j++){r-=weights[left[j]];if(r<0){k=j;break}}order.push(left.splice(k,1)[0])}return order}

function ensureCardConfig(){config.cards||={};config.cards.backImage||='';config.cards.frontImage||='';if(config.cards.centerNumbers==null)config.cards.centerNumbers=true;if(!Array.isArray(config.cards.rankImages))config.cards.rankImages=Array(13).fill('');config.cards.rankImages=Array.from({length:13},(_,i)=>config.cards.rankImages[i]||'');config.cards.jokerImage||=''}

/* ARCADE V10 public index image optimization */
async function reencodeDataUrl(src,maxSide=640,quality=.68){
  if(!src||typeof src!=='string'||!src.startsWith('data:image/'))return src;
  try{
    let img=await loadImageMaybe(src);if(!img)return src;
    let sw=img.naturalWidth||img.width||1,sh=img.naturalHeight||img.height||1;
    let scale=Math.min(1,maxSide/Math.max(sw,sh));
    let w=Math.max(1,Math.round(sw*scale)),h=Math.max(1,Math.round(sh*scale));
    let cv=document.createElement('canvas');cv.width=w;cv.height=h;
    let ctx=cv.getContext('2d',{alpha:true});ctx.clearRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);
    return cv.toDataURL('image/webp',quality);
  }catch(e){return src}
}
async function optimizePublicDataImages(data){
  let d=copyData(data),cache=new Map();
  async function opt(src,max,q){
    if(!src||typeof src!=='string'||!src.startsWith('data:image/'))return src;
    let key=max+'|'+q+'|'+src;
    if(cache.has(key))return cache.get(key);
    let v=await reencodeDataUrl(src,max,q);cache.set(key,v);return v;
  }
  d.background=await opt(d.background,1280,.66);
  if(d.dealer){
    d.dealer.common=await opt(d.dealer.common,640,.68);
    if(d.dealer.games)for(let k of Object.keys(d.dealer.games)){
      let g=d.dealer.games[k];if(!g)continue;
      for(let f of ['default','deal','cheer','sad','watch'])if(g[f])g[f]=await opt(g[f],640,.68);
    }
  }
  if(Array.isArray(d.characters))for(let c of d.characters)c.image=await opt(c.image,640,.68);
  if(Array.isArray(d.games))for(let g of d.games)g.iconImage=await opt(g.iconImage,512,.68);
  if(Array.isArray(d.roulette))for(let r of d.roulette)r.image=await opt(r.image,512,.68);
  if(d.cards){
    d.cards.backImage=await opt(d.cards.backImage,640,.70);
    d.cards.frontImage=await opt(d.cards.frontImage,640,.70);
    if(Array.isArray(d.cards.rankImages))for(let i=0;i<d.cards.rankImages.length;i++)d.cards.rankImages[i]=await opt(d.cards.rankImages[i],640,.70);
    d.cards.jokerImage=await opt(d.cards.jokerImage,640,.70);
  }
  if(Array.isArray(d.raceComics))for(let i=0;i<d.raceComics.length;i++)d.raceComics[i]=await opt(d.raceComics[i],960,.72);
  return d;
}

function fitTrumpWatermarkFont(ctx,symbol,maxW,maxH,start){
  let low=80,high=start||620,best=low;
  while(low<=high){
    let mid=(low+high)>>1;
    ctx.font=`900 ${mid}px serif`;
    let m=ctx.measureText(symbol),mw=m.width||mid,mh=(m.actualBoundingBoxAscent||mid*.76)+(m.actualBoundingBoxDescent||mid*.18);
    if(mw<=maxW&&mh<=maxH){best=mid;low=mid+1}else high=mid-1;
  }
  return best;
}

const MEMORY_CPU_LEVELS={

function memoryVersusMenu(){

  shell('🤖 CPU対戦',`<div class="gameTable centeredGame"><div class="memoryRules"><b>CPUの強さ：</b>強いほど、これまで表になったカードをよく覚え、知っているペアを正確に取りにいきます。カードの中身を透視する処理はしません。</div><div class="cpuLevelGrid">${buttons}</div><div class="actionBar"><button class="btn alt" onclick="memoryVersusMenu()">← 戻る</button></div></div>`,'CPUの記憶力を選ぼう！')

function startMemoryHumanVsHuman(){memGame={type:'versus',turn:0,scores:[0,0],cpu:false};startMemory54('versus')}
function startMemoryCPU(level){
  level=Math.max(1,Math.min(5,+level||3));
  memGame={type:'versus',turn:0,scores:[0,0],cpu:true,cpuLevel:level,cpuMemory:[],cpuThinking:false};
  startMemory54('versus')
}
function memoryMode(type){

  memoryVersusMenu()
}
function startMemoryVersus(){memoryVersusMenu()}
function memoryCpuCfg(){return MEMORY_CPU_LEVELS[memGame?.cpuLevel||3]||MEMORY_CPU_LEVELS[3]}
function cpuPruneMemory(){
  let m=memGame;if(!m?.cpu)return;
  let seen=new Set(),valid=[];
  for(let i=m.cpuMemory.length-1;i>=0;i--){let idx=m.cpuMemory[i];if(seen.has(idx)||m.done.includes(idx))continue;seen.add(idx);valid.push(idx)}
  valid.reverse();let max=memoryCpuCfg().maxMemory;if(valid.length>max)valid=valid.slice(valid.length-max);m.cpuMemory=valid
}
function cpuObserve(index){
  let m=memGame;if(!m?.cpu||m.done.includes(index))return;
  let cfg=memoryCpuCfg();
  if(Math.random()>cfg.remember)return;
  m.cpuMemory=m.cpuMemory.filter(x=>x!==index);m.cpuMemory.push(index);cpuPruneMemory()
}
function cpuKnownPairs(){
  let m=memGame;if(!m?.cpu)return[];cpuPruneMemory();let by={};
  for(let idx of m.cpuMemory){if(m.done.includes(idx))continue;let key=memoryCardData(m.arr[idx]).key;(by[key]||(by[key]=[])).push(idx)}
  return Object.values(by).filter(a=>a.length>=2)
}
function cpuRandomAvailable(exclude=[]){
  let m=memGame,ex=new Set(exclude),pool=m.arr.map((_,i)=>i).filter(i=>!m.done.includes(i)&&!m.open.includes(i)&&!ex.has(i));
  return pool.length?pool[Math.floor(Math.random()*pool.length)]:null
}
function cpuMatchingKnown(firstIndex){
  let m=memGame,key=memoryCardData(m.arr[firstIndex]).key;cpuPruneMemory();let pool=m.cpuMemory.filter(i=>i!==firstIndex&&!m.done.includes(i)&&!m.open.includes(i)&&memoryCardData(m.arr[i]).key===key);return pool.length?pool[Math.floor(Math.random()*pool.length)]:null
}
function updateMemoryStatus(){
  let m=memGame,e=$('#memStatus');if(!e||!m)return;
  if(m.type==='solo'){e.textContent=`54枚・ペア ${m.done.length/2}/27　ミス ${m.miss}`;return}
  let who=m.cpu?(m.turn===0?'あなた':'CPU'):`プレイヤー${m.turn+1}`;
  let scoreText=m.cpu?`あなた ${m.scores[0]} - ${m.scores[1]} CPU`:`${m.scores[0]} - ${m.scores[1]}`;
  e.innerHTML=`54枚・${who}の番　${scoreText}${m.cpu&&m.turn===1&&m.cpuThinking?'<span class="cpuThinking">考え中…</span>':''}`
}
function resetMemoryCard(i){let x=$('#m'+i);if(x){x.textContent='?';x.classList.remove('open')}}
function finishMemoryMiss(a,b){
  let m=memGame;[a,b].forEach(resetMemoryCard);m.open=[];
  if(m.type==='solo')m.miss++;else m.turn=1-m.turn;m.locked=false;updateMemoryStatus();
  if(m.cpu&&m.turn===1&&!m.ended)setTimeout(cpuMemoryTurn,260)
}
function flip(i,actor='human'){
  let m=memGame;if(!m||m.ended||m.locked||m.done.includes(i)||m.open.includes(i)||m.open.length>=2)return;
  if(m.cpu&&m.type==='versus'){if(actor==='human'&&m.turn===1)return;if(actor==='cpu'&&m.turn!==1)return}
  let e=$('#m'+i);if(!e)return;e.innerHTML=memoryFace(m.arr[i]);e.classList.add('open');m.open.push(i);cpuObserve(i);if(m.open.length<2)return;
  m.locked=true;let[a,b]=m.open,da=memoryCardData(m.arr[a]),db=memoryCardData(m.arr[b]),hit=da.key===db.key;
  if(hit){
    m.done.push(a,b);m.cpuMemory=m.cpuMemory?.filter(x=>x!==a&&x!==b)||[];m.open=[];$('#m'+a)?.classList.add('done');$('#m'+b)?.classList.add('done');
    if(m.type==='versus')m.scores[m.turn]++;m.locked=false;updateMemoryStatus();
    if(m.done.length===54){memoryComplete();return}
    if(m.cpu&&m.turn===1)setTimeout(cpuMemoryTurn,350);return
  }
  setTimeout(()=>finishMemoryMiss(a,b),650)
}
async function cpuMemoryTurn(){
  let m=memGame;if(!m?.cpu||m.ended||m.turn!==1||m.locked||m.cpuThinking)return;
  m.cpuThinking=true;updateMemoryStatus();let cfg=memoryCpuCfg();
  await new Promise(r=>setTimeout(r,cfg.delay));if(m.ended||m.turn!==1){m.cpuThinking=false;updateMemoryStatus();return}
  let pair=cpuKnownPairs(),first=null;
  if(pair.length&&Math.random()<cfg.usePair){let p=pair[Math.floor(Math.random()*pair.length)];first=p[0]}else first=cpuRandomAvailable();
  if(first==null){m.cpuThinking=false;return}m.cpuThinking=false;flip(first,'cpu');
  await new Promise(r=>setTimeout(r,cfg.delay));if(m.ended||m.turn!==1||m.open.length!==1)return;
  let second=null,known=cpuMatchingKnown(first);if(known!=null&&Math.random()<cfg.secondMatch)second=known;else second=cpuRandomAvailable([first]);
  if(second!=null)flip(second,'cpu')
}
function memoryComplete(){
  let m=memGame;if(!m||m.ended)return;m.ended=true;
  if(m.type==='solo'){let reward=Math.max(5,30-Math.floor(m.miss/3));state.wallet+=reward;saveState();pop('COMPLETE！',`54枚クリア！<br>ミス ${m.miss}回<br>${shellIconHTML()}${reward}獲得`,'win','rare');return}
  let winner=m.scores[0]===m.scores[1]?-1:m.scores[0]>m.scores[1]?0:1;if(winner>=0){state.wallet+=10;saveState()}
  let title;if(winner<0)title='DRAW';else if(m.cpu)title=winner===0?'YOU WIN！':'CPU WIN！';else title=`プレイヤー${winner+1} WIN！`;
  let sub=winner<0?'引き分け':`${shellIconHTML()}10獲得！`;pop(title,sub,winner===0||(!m.cpu&&winner>=0)?'win':'')
}

async function optimizePublicDataImages(data,settings){
  let d=copyData(data),cache=new Map();
  let cfg=Object.assign({quality:.68,backgroundMax:1280,dealerMax:640,characterMax:640,iconMax:512,rouletteMax:512,cardMax:640,comicMax:960},settings||{});
  async function opt(src,max,q){
    if(!src||typeof src!=='string'||!src.startsWith('data:image/'))return src;
    let key=max+'|'+q+'|'+src;if(cache.has(key))return cache.get(key);
    let v=await reencodeDataUrl(src,max,q);cache.set(key,v);return v;
  }
  d.background=await opt(d.background,cfg.backgroundMax,cfg.quality);
  if(d.dealer){d.dealer.common=await opt(d.dealer.common,cfg.dealerMax,cfg.quality);if(d.dealer.games)for(let k of Object.keys(d.dealer.games)){let g=d.dealer.games[k];if(!g)continue;for(let f of ['default','deal','cheer','sad','watch'])if(g[f])g[f]=await opt(g[f],cfg.dealerMax,cfg.quality)}}
  if(Array.isArray(d.characters))for(let c of d.characters)c.image=await opt(c.image,cfg.characterMax,cfg.quality);
  if(Array.isArray(d.games))for(let g of d.games)g.iconImage=await opt(g.iconImage,cfg.iconMax,cfg.quality);
  if(Array.isArray(d.roulette))for(let i=0;i<d.roulette.length;i++){let src=admin.roulette?.[i]?.image||d.roulette[i].image||'';d.roulette[i].image=await opt(src,cfg.rouletteMax,Math.min(.9,cfg.quality+.04));}

}
