const suits=['♠','♥','♦','♣'];function deck(){let d=[];for(let s of suits)for(let v=1;v<=13;v++)d.push({s,v});return d.sort(()=>Math.random()-.5)}function card(c,cls=''){let v=c.v===1?'A':c.v===11?'J':c.v===12?'Q':c.v===13?'K':c.v;return `<span class="playing ${c.s==='♥'||c.s==='♦'?'red':''} ${cls}">${c.s}${v}</span>`}function highlow(mode){hl={mode,d:deck()};hl.cur=hl.d.pop();shell('🃏 HIGH & LOW',`<div class="gameTable"><div class="hlStage" id="hlStage">${card(hl.cur,'hlOld')}<span class="playing back hlNew" id="hlNew">🐚</span></div><p style="text-align:center">次のカードは？</p><div class="actionBar"><button class="btn" onclick="hlGuess('high')">⬆ HIGH</button><button class="btn pink" onclick="hlGuess('low')">⬇ LOW</button></div></div>`,'中央のカードより高い？低い？')}

function memory(){let a=['🐬','🐙','🐠','🦀','🐡','🦑'],arr=[...a,...a].sort(()=>Math.random()-.5);window.mem={arr,open:[],done:[]};shell('🧠 神経衰弱',`<div class="gameTable"><div class="memoryGrid">${arr.map((x,i)=>`<button class="memoryCard" id="m${i}" onclick="flip(${i})">?</button>`).join('')}</div><div id="memoryResult"></div></div>`,'12枚すべてが画面に入るコンパクト盤だよ！')}function flip(i){let m=window.mem;if(m.done.includes(i)||m.open.includes(i)||m.open.length>=2)return;let e=$('#m'+i);e.textContent=m.arr[i];e.classList.add('open');m.open.push(i);if(m.open.length===2){let[a,b]=m.open;if(m.arr[a]===m.arr[b]){m.done.push(a,b);m.open=[];$('#m'+a).classList.add('done');$('#m'+b).classList.add('done');dealerSay('そろった！','cheer');if(m.done.length===m.arr.length)pop('🎉 COMPLETE!','全部の仲間を見つけたよ！','win')}else{dealerSay('場所を覚えてね！','watch');setTimeout(()=>{[a,b].forEach(n=>{let x=$('#m'+n);x.textContent='?';x.classList.remove('open')});m.open=[]},650)}}}

async function runRace(mode){let button=window.event?.currentTarget;if(button)button.disabled=true;let count=mode==='draw'?+$('#racers').value:config.characters.length,order=[...Array(count).keys()];for(let i=order.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}let area=$('#raceArea');area.innerHTML='<div id="comicCover"></div><div id="track" class="hidden"></div><div id="raceResult"></div>';let scenes=[{chars:[order[2]||0,order[4]||1],text:'一斉にスタート！先頭争いが始まった！'},{chars:[order[1]||0,order[3]||1],text:'折り返し！順位が大きく入れ替わる！'},{chars:[order[0],order[1]||0],text:'最後の直線へ！デッドヒート！'}];for(let i=0;i<3;i++){let s=scenes[i];$('#comicCover').innerHTML=`<div class="comicSolo"><div class="comicChars">${s.chars.map(x=>charVisual(x,'110px')).join('')}<b>💨</b></div><div class="comicCaption">${s.text}</div><div class="comicPage">${i+1}/3</div></div>`;dealerSay(s.text,i===2?'cheer':'watch');await sleep(1050)}$('#comicCover').innerHTML='<div class="countdown">3</div>';for(let n=3;n>0;n--){$('#comicCover .countdown').textContent=n;await sleep(520)}$('#comicCover').remove();let track=$('#track');track.classList.remove('hidden');track.innerHTML=`<div id="race" class="race running">${[...Array(count)].map((_,i)=>`<div class="lane"><div class="runner" id="r${i}">${charVisual(i,'40px')} ${esc(config.characters[i].name)}</div></div>`).join('')}<div class="finish"></div></div>`;dealerSay('漫画が開いた！最終ストレート、スタート！','cheer');let target={};order.forEach((v,i)=>target[v]=i),prog=Array(count).fill(0),tick=0;await new Promise(resolve=>{let timer=setInterval(()=>{tick++;for(let i=0;i<count;i++){let el=$('#r'+i);if(!el){clearInterval(timer);resolve();return}prog[i]+=1.35+Math.random()*2+(count-target[i])*.028;el.style.left=Math.min(88,prog[i])+'%'}if(tick>=42){clearInterval(timer);resolve()}},90)});$('#race')?.classList.remove('running');finishRace(mode,order)}
function finishRace(mode,order){let winner=config.characters[order[0]],win=false,extra='';if(mode==='draw'){let t=$('#drawType')?.value;if(t==='all')extra=`<ol>${order.map(i=>`<li>${esc(config.characters[i].name)}</li>`).join('')}</ol>`;if(t==='three')extra=`<p>当たり：${order.slice(0,3).map(i=>esc(config.characters[i].name)).join(' / ')}</p>`}else{win=+$('#pick')?.value===order[0];let b=mode==='medal'?Math.max(1,Math.min(20,+$('#bet')?.value||1)):0;if(mode==='medal'&&state.wallet>=b){state.wallet-=b;if(win)state.wallet+=b*5;saveState()}}$('#raceResult').innerHTML=extra;let el=document.createElement('div');el.className='popup';el.innerHTML=`<div class="popupBox winnerBox"><div class="winnerVisual">${charVisual(order[0],'190px')}</div><h2>🏆 ${esc(winner.name)}</h2><p>${mode==='draw'?'1位決定！':win?'予想的中！':'1位はこのキャラクター！'}</p><button class="btn gold" onclick="this.closest('.popup').remove()">OK</button></div>`;document.body.appendChild(el);dealerSay(`ゴール！${winner.name}が1位！`,'cheer')}
const slotSymbols3=[{s:'💎',m:10},{s:'⭐',m:6},{s:'🐚',m:4},{s:'🐬',m:4},{s:'🍬',m:4}];
function slot(mode){shell('🎰 SHELL SLOT',`<div class="gameTable centeredGame"><div class="gameStatus">残り 🐚<b id="slotRemain">${state.wallet}</b></div>${mode==='medal'?`<label>かける枚数 <input id="slotBet" type="number" min="1" max="20" value="5"></label>`:'<p>フリープレイ</p>'}<div class="slotMachine">${[0,1,2].map(i=>`<div class="reel" id="reel${i}">🐚</div>`).join('')}</div><div class="stopGrid">${[0,1,2].map(i=>`<button id="stop${i}" class="btn pink" disabled onclick="stopReel(${i})">STOP ${i+1}</button>`).join('')}</div><div class="actionBar"><button id="spin" class="btn gold" onclick="startSlot('${mode}')">SPIN</button></div><div class="payTable payBelow"><span>💎×3＝10倍</span><span>⭐×3＝6倍</span><span>同柄×3＝4倍</span><span>同柄×2＝2倍</span><span>ハズレ＝0倍</span></div></div>`,'中央の操作でテンポよく止めよう！')}
function startSlot(mode){if(slotState?.running)return;let bet=mode==='medal'?Math.max(1,Math.min(20,+$('#slotBet').value||1)):0;if(!spend(mode,bet)){dealerSay('メダルが足りないよ。','sad');return}$('#slotRemain').textContent=state.wallet;slotState={mode,bet,running:true,stopped:[false,false,false],values:[0,0,0],ticks:[0,2,4]};$('#spin').disabled=true;for(let i=0;i<3;i++){$('#reel'+i).classList.add('spinning');$('#stop'+i).disabled=false}slotState.timer=setInterval(()=>{for(let i=0;i<3;i++)if(!slotState.stopped[i]){slotState.ticks[i]=(slotState.ticks[i]+1)%slotSymbols3.length;slotState.values[i]=slotState.ticks[i];$('#reel'+i).textContent=slotSymbols3[slotState.values[i]].s}},55)}
function highlow(mode){hlRun={mode,pot:0,base:5,d:deck(),active:false};shell('🃏 HIGH & LOW',`<div class="gameTable centeredGame"><div class="gameStatus">残り 🐚${state.wallet}</div>${mode==='medal'?'<label>最初にかける枚数 <input id="hlBet" type="number" min="1" max="20" value="5"></label>':''}<div class="actionBar"><button class="btn gold" onclick="hlStart()">ゲーム開始</button></div></div>`,'勝つたび賞金が2倍。好きな時に降りられるよ！')}
function hlStart(){let b=hlRun.mode==='medal'?Math.max(1,Math.min(20,+$('#hlBet')?.value||1)):5;if(!spend(hlRun.mode,b)){dealerSay('メダルが足りないよ。','sad');return}hlRun.pot=b;hlRun.active=true;hlRun.cur=hlRun.d.pop();hlRound()}
function hlRound(){shell('🃏 HIGH & LOW',`<div class="gameTable"><div class="gameStatus">現在の勝負額 🐚<b>${hlRun.pot}</b>　勝てば ${hlRun.pot*2}</div><div class="hlStage">${card(hlRun.cur,'hlOld')}${cardBack('hlNew')}</div><div class="actionBar"><button class="btn" onclick="hlGuess('high')">⬆ HIGH</button><button class="btn pink" onclick="hlGuess('low')">⬇ LOW</button></div></div>`,'高いか低いか予想してね！')}
async function hlGuess(g){let n=hlRun.d.pop(),ok=g==='high'?n.v>=hlRun.cur.v:n.v<=hlRun.cur.v;dealerSay('カードを公開！','deal');await sleep(400);$('.hlNew').outerHTML=card(n,'hlNew reveal');await sleep(450);if(!ok){hlRun.pot=0;pop('残念！','勝負額はなくなりました');dealerSay('次はきっと当たるよ。','sad');return}hlRun.pot*=2;hlRun.cur=n;let el=document.createElement('div');el.className='popup';el.innerHTML=`<div class="popupBox"><h2>🎉 WIN！</h2><p>現在 🐚${hlRun.pot}</p><button class="btn" onclick="hlDecision(true);this.closest('.popup').remove()">続ける</button> <button class="btn gold" onclick="hlDecision(false);this.closest('.popup').remove()">降りて受け取る</button></div>`;document.body.appendChild(el)}
function hlDecision(cont){if(cont){hlRound()}else{if(hlRun.mode==='medal'){state.wallet+=hlRun.pot;saveState()}pop('CASH OUT',`${hlRun.pot}🐚獲得！`);hlRun.pot=0}}
function blackjack(mode){bjRun={mode,pot:0,base:5,active:false};shell('♠️ BLACKJACK',`<div class="gameTable centeredGame"><div class="gameStatus">残り 🐚${state.wallet}</div>${mode==='medal'?'<label>最初にかける枚数 <input id="bjBet" type="number" min="1" max="20" value="5"></label>':''}<div class="actionBar"><button class="btn gold" onclick="bjStart()">ゲーム開始</button></div></div>`,'勝った賞金を次の勝負へ持ち越せるよ！')}
function bjStart(){let b=bjRun.mode==='medal'?Math.max(1,Math.min(20,+$('#bjBet')?.value||1)):5;if(!bjRun.active){if(!spend(bjRun.mode,b)){dealerSay('メダルが足りないよ。','sad');return}bjRun.pot=b;bjRun.active=true}bj={mode:bjRun.mode,d:deck(),p:[],c:[]};bj.p=[bj.d.pop(),bj.d.pop()];bj.c=[bj.d.pop(),bj.d.pop()];bjRender()}
function bjRender(){shell('♠️ BLACKJACK',`<div class="gameTable"><div class="gameStatus">勝負額 🐚${bjRun.pot}</div><p>ファマリン <b>?</b></p><div class="cards">${card(bj.c[0])}${cardBack()}</div><p>あなた <b>${val(bj.p)}</b></p><div class="cards playerHand">${bj.p.map(c=>card(c,'dealt')).join('')}</div><div class="actionBar"><button class="btn" onclick="bjHit()">HIT</button><button class="btn pink" onclick="bjStand()">STAND</button></div></div>`,'HITかSTANDを選んでね！')}
function bjEnd(result){let win=result==='WIN',tie=result==='DRAW';if(!win&&!tie){bjRun.pot=0;bjRun.active=false;pop('DEALER WIN',`あなた ${val(bj.p)} / ファマリン ${val(bj.c)}`);return}if(win)bjRun.pot*=2;let el=document.createElement('div');el.className='popup';el.innerHTML=`<div class="popupBox"><h2>${tie?'DRAW':'🎉 YOU WIN!'}</h2><p>現在 🐚${bjRun.pot}</p><button class="btn" onclick="bjDecision(true);this.closest('.popup').remove()">続ける</button><button class="btn gold" onclick="bjDecision(false);this.closest('.popup').remove()">降りて受け取る</button></div>`;document.body.appendChild(el)}
function bjDecision(cont){if(cont)bjStart();else{if(bjRun.mode==='medal'){state.wallet+=bjRun.pot;saveState()}pop('CASH OUT',`${bjRun.pot}🐚獲得！`);bjRun.pot=0;bjRun.active=false}}
function memoryMode(type){if(type==='solo'){memGame={type,level:0};startMemorySolo()}else startMemoryVersus()}
function startMemorySolo(){let levels=[12,20,30,40,50],count=levels[memGame.level]||50;startMemoryBoard(count,'solo')}
function startMemoryVersus(){memGame={type:'versus',turn:0,scores:[0,0]};startMemoryBoard(50,'versus')}
function startMemoryBoard(count,type){let pairs=seaPairs.slice(0,count/2),arr=[...pairs,...pairs].sort(()=>Math.random()-.5);memGame=Object.assign(memGame,{arr,open:[],done:[],miss:0,type});shell('🧠 神経衰弱',`<div class="gameTable"><div class="gameStatus" id="memStatus">${type==='solo'?`LEVEL ${memGame.level+1}　失敗 0/3`:'プレイヤー1の番　0 - 0'}</div><div class="memoryGrid fifty">${arr.map((x,i)=>`<button class="memoryCard" id="m${i}" onclick="flip(${i})">?</button>`).join('')}</div></div>`,type==='solo'?'3回失敗する前に全部そろえよう！':'同じ絵を見つけたら続けてめくれるよ！')}
function flip(i){let m=memGame;if(!m||m.done.includes(i)||m.open.includes(i)||m.open.length>=2)return;let e=$('#m'+i);e.textContent=m.arr[i];e.classList.add('open');m.open.push(i);if(m.open.length<2)return;let[a,b]=m.open;if(m.arr[a]===m.arr[b]){m.done.push(a,b);m.open=[];$('#m'+a).classList.add('done');$('#m'+b).classList.add('done');if(m.type==='versus')m.scores[m.turn]++;updateMemoryStatus();if(m.done.length===m.arr.length)memoryComplete()}else setTimeout(()=>{[a,b].forEach(n=>{let x=$('#m'+n);x.textContent='?';x.classList.remove('open')});m.open=[];if(m.type==='solo'){m.miss++;if(m.miss>=3){pop('GAME OVER','失敗が3回になりました');return}}else m.turn=1-m.turn;updateMemoryStatus()},520)}
function updateMemoryStatus(){let m=memGame,e=$('#memStatus');if(!e)return;e.textContent=m.type==='solo'?`LEVEL ${m.level+1}　失敗 ${m.miss}/3`:`プレイヤー${m.turn+1}の番　${m.scores[0]} - ${m.scores[1]}`}
function memoryComplete(){let m=memGame;if(m.type==='solo'){let reward=[2,4,6,8,10][m.level]||10;state.wallet+=reward;saveState();if(m.level<4){m.level++;pop('LEVEL CLEAR!',`${reward}🐚獲得！次は${[12,20,30,40,50][m.level]}枚`);setTimeout(startMemorySolo,1000)}else pop('ALL CLEAR!',`${reward}🐚獲得！`,'win')}else{let win=m.scores[0]===m.scores[1]?-1:(m.scores[0]>m.scores[1]?0:1),reward=10;if(win>=0){state.wallet+=reward;saveState()}pop(win<0?'DRAW':`プレイヤー${win+1} WIN!`,win<0?'引き分け！':`${reward}🐚獲得！`,'win')}}
function roulette(mode){let colors={PINK:'#ff6f9f',AQUA:'#49cfe1'},grad=config.roulette.map((x,i)=>`${colors[x.color]||colors.PINK} ${i*36}deg ${(i+1)*36}deg`).join(','),options=config.roulette.map((x,i)=>`<option value="${i}">${esc(x.label)}</option>`).join('');shell('🎯 MARINE ROULETTE',`<div class="gameTable rouletteWrap"><div class="wheelBox"><div class="pointer">▼</div><div id="wheel" class="wheel" style="background:conic-gradient(${grad})">${config.roulette.map((x,i)=>`<div class="wheelItem group-${x.group}" style="transform:rotate(${i*36}deg) translateY(-135px) rotate(${-i*36}deg)">${x.image?`<img src="${x.image}">`:esc(x.label)}</div>`).join('')}</div><div class="wheelHub">SPIN</div></div><div><label>予想方法 <select id="betType" onchange="updateRouletteBet()"><option value="exact">個別当て</option><option value="color">色当て</option><option value="group">グループ当て</option></select></label><div id="betChoice"><select id="betValue">${options}</select></div>${mode==='medal'?betBox():''}<div class="actionBar"><button id="rouBtn" class="btn gold" onclick="spinRoulette('${mode}')">SPIN!</button></div><div class="oddsList"><b>倍率一覧</b><span>個別 8倍</span><span class="pinkDot">PINK 2倍</span><span class="aquaDot">AQUA 2倍</span><span>LOW 0〜4：3倍</span><span>HIGH 5〜9：3倍</span></div></div></div>`,'色とグループが盤面と一覧で分かるよ！')}
function poker(mode){pokerRun={mode,pot:0,active:false};shell('♦️ MARINE POKER',`<div class="gameTable centeredGame"><div class="gameStatus">残り 🐚${state.wallet}</div>${mode==='medal'?'<label>最初にかける枚数 <input id="pokerBet" type="number" min="1" max="20" value="5"></label>':''}<div class="actionBar"><button class="btn gold" onclick="pokerStart()">5枚配る</button></div><div class="oddsList"><span>ワンペア2倍</span><span>ツーペア3倍</span><span>スリーカード4倍</span><span>ストレート5倍</span><span>フラッシュ6倍</span><span>フルハウス8倍</span><span>フォーカード12倍</span></div></div>`,'残すカードを選んで、1回交換しよう！')}
function pokerStart(){let b=pokerRun.mode==='medal'?Math.max(1,Math.min(20,+$('#pokerBet')?.value||1)):5;if(!pokerRun.active){if(!spend(pokerRun.mode,b)){dealerSay('メダルが足りないよ。','sad');return}pokerRun.pot=b;pokerRun.active=true}pokerRun.d=deck();pokerRun.hand=[0,0,0,0,0].map(()=>pokerRun.d.pop());pokerRun.hold=[];pokerRender()}
function pokerRender(){shell('♦️ MARINE POKER',`<div class="gameTable"><div class="gameStatus">勝負額 🐚${pokerRun.pot}</div><p>残すカードをタップ</p><div class="pokerHand">${pokerRun.hand.map((c,i)=>`<button class="pokerCard" id="pc${i}" onclick="holdPoker(${i})">${card(c)}</button>`).join('')}</div><div class="actionBar"><button class="btn gold" onclick="drawPoker()">選ばなかったカードを交換</button></div></div>`,'残すカードにはHOLDが付くよ！')}
function holdPoker(i){let p=pokerRun.hold.indexOf(i);if(p>=0)pokerRun.hold.splice(p,1);else pokerRun.hold.push(i);$('#pc'+i).classList.toggle('held');$('#pc'+i).dataset.hold=p<0?'HOLD':''}
function pokerRank(h){let vs=h.map(x=>x.v).sort((a,b)=>a-b),cnt={};vs.forEach(v=>cnt[v]=(cnt[v]||0)+1);let groups=Object.values(cnt).sort((a,b)=>b-a),flush=h.every(x=>x.s===h[0].s),straight=new Set(vs).size===5&&(vs[4]-vs[0]===4||vs.join(',')==='1,10,11,12,13');if(groups[0]===4)return['フォーカード',12];if(groups[0]===3&&groups[1]===2)return['フルハウス',8];if(flush)return['フラッシュ',6];if(straight)return['ストレート',5];if(groups[0]===3)return['スリーカード',4];if(groups[0]===2&&groups[1]===2)return['ツーペア',3];if(groups[0]===2)return['ワンペア',2];return['ノーペア',0]}
function drawPoker(){pokerRun.hand=pokerRun.hand.map((c,i)=>pokerRun.hold.includes(i)?c:pokerRun.d.pop());let[name,mult]=pokerRank(pokerRun.hand);shell('♦️ MARINE POKER',`<div class="gameTable"><div class="pokerHand">${pokerRun.hand.map(c=>card(c,'dealt')).join('')}</div><h2 style="text-align:center">${name}</h2></div>`,name);if(!mult){pokerRun.pot=0;pokerRun.active=false;pop('RESULT',name);return}pokerRun.pot*=mult;let el=document.createElement('div');el.className='popup';el.innerHTML=`<div class="popupBox"><h2>${name}！</h2><p>現在 🐚${pokerRun.pot}</p><button class="btn" onclick="pokerDecision(true);this.closest('.popup').remove()">続ける</button><button class="btn gold" onclick="pokerDecision(false);this.closest('.popup').remove()">降りて受け取る</button></div>`;document.body.appendChild(el)}
function pokerDecision(cont){if(cont)pokerStart();else{if(pokerRun.mode==='medal'){state.wallet+=pokerRun.pot;saveState()}pop('CASH OUT',`${pokerRun.pot}🐚獲得！`);pokerRun.pot=0;pokerRun.active=false}}
function bjStand(){while(val(bj.c)<17)bj.c.push(bj.d.pop());let p=val(bj.p),c=val(bj.c),win=c>21||p>c,tie=p===c;bjEnd(win?'WIN':tie?'DRAW':'DEALER WIN')}

Object.assign(window,{setPlayers,resetWallet,choosePlayerIcon,back,openGame,setupRace,runRace,slot,startSlot,stopReel,highlow,hlGuess,blackjack,bjHit,bjStand,memory,flip,roulette,updateRouletteBet,spinRoulette,hlStart,hlDecision,bjStart,bjDecision,memoryMode,startMemorySolo,startMemoryVersus,poker,pokerStart,holdPoker,drawPoker,pokerDecision});
function boot(){applyVisuals();renderHome()}boot();
</script>
<script id="admin-script" data-master>
'use strict';const ADMIN_KEY='mta-admin-v2';let admin=loadAdmin();function copyData(v){return JSON.parse(JSON.stringify(v))}function defaults(){return{password:'3103',autoSave:true,allowPublicImageSave:false,updatedAt:'',background:'',dealerImage:window.__PUBLIC__.dealerImage,characters:copyData(window.__PUBLIC__.characters),games:copyData(window.__PUBLIC__.games),roulette:copyData(window.__PUBLIC__.roulette),imageMax:1024,imageQuality:.82}}function loadAdmin(){try{let a=JSON.parse(localStorage.getItem(ADMIN_KEY));return Object.assign(defaults(),a||{})}catch(e){return defaults()}}function publicData(){return{background:admin.background||'',allowPublicImageSave:!!admin.allowPublicImageSave,dealerImage:admin.dealerImage,characters:admin.characters.map(({name,emoji,image})=>({name,emoji,image})),games:admin.games.map(({id,name,icon,desc})=>({id,name,icon,desc})),roulette:admin.roulette.map(({label,image,color,group})=>({label,image,color,group}))}}function syncConfig(){config=window.__PUBLIC__=publicData();applyVisuals();renderHome()}function adminSave(show=false){admin.updatedAt=new Date().toLocaleString('ja-JP');localStorage.setItem(ADMIN_KEY,JSON.stringify(admin));syncConfig();if(show)alert('保存しました')}function maybeAdminSave(){if(admin.autoSave)adminSave()}function adminLogin(){let pw=prompt('管理パスワード');if(pw===admin.password)openAdmin();else if(pw!==null)alert('パスワードが違います')}function openAdmin(){let o=document.createElement('div');o.id='adminOverlay';o.className='adminOverlay';o.innerHTML=`<div class="adminBox"><div class="adminNav row"><button class="btn alt" onclick="closeAdmin()">← 閉じる</button><b>MARINE TRICK ARCADE 管理</b><button class="btn" onclick="adminSave(true)">💾 手動保存</button><button class="btn gold" onclick="exportPublic()">🌐 index.html書き出し</button><button class="btn pink" onclick="testAdminLogin()">🔑 ログイン確認</button></div><section class="panel"><h3>基本設定</h3><div class="adminGrid"><label>管理パスワード<input value="${esc(admin.password)}" onchange="admin.password=this.value;maybeAdminSave()"></label><label><input type="checkbox" ${admin.autoSave?'checked':''} onchange="admin.autoSave=this.checked;adminSave()"> 自動保存</label><label><input type="checkbox" ${admin.allowPublicImageSave?'checked':''} onchange="admin.allowPublicImageSave=this.checked;maybeAdminSave()"> 公開側の画像保存を許可</label><label>更新日時<input value="${esc(admin.updatedAt||'未保存')}" readonly></label><label>最大辺<select onchange="admin.imageMax=+this.value;maybeAdminSave()">${[512,1024,1600,2048].map(v=>`<option ${admin.imageMax===v?'selected':''}>${v}</option>`).join('')}</select></label><label>画像品質<input type="number" min="0.4" max="1" step="0.05" value="${admin.imageQuality}" onchange="admin.imageQuality=+this.value;maybeAdminSave()"></label></div></section><section class="panel"><h3>背景同期</h3><input type="file" accept="image/*" onchange="setBackground(this.files[0])"> <button class="btn danger" onclick="admin.background='';maybeAdminSave();openAdminRefresh()">解除</button></section><section class="panel"><h3>キャラクター個別登録・画像差し替え</h3>${admin.characters.map((c,i)=>adminChar(c,i)).join('')}</section><section class="panel"><h3>ゲーム表示・並び替え</h3>${admin.games.map((g,i)=>`<div class="adminItem"><b>${g.icon} ${esc(g.name)}</b><div><input value="${esc(g.name)}" onchange="admin.games[${i}].name=this.value;maybeAdminSave()"><input value="${esc(g.desc)}" onchange="admin.games[${i}].desc=this.value;maybeAdminSave()"></div><div><button class="btn alt" onclick="moveGame(${i},-1)">↑</button><button class="btn alt" onclick="moveGame(${i},1)">↓</button></div></div>`).join('')}</section><section class="panel"><h3>ルーレット盤 個別登録</h3><p>ラベル・画像・色・グループを各マスごとに設定できます。</p>${admin.roulette.map((r,i)=>adminRoulette(r,i)).join('')}</section><section class="panel"><h3>JSON 入出力</h3><button class="btn" onclick="exportJSON()">JSON書き出し</button> <input type="file" accept="application/json,.json" onchange="importJSON(this.files[0])"></section></div>`;document.body.appendChild(o)}function adminChar(c,i){return `<div class="adminItem"><div>${c.image?`<img class="thumb" src="${c.image}">`:c.emoji}</div><div><input value="${esc(c.name)}" onchange="admin.characters[${i}].name=this.value;maybeAdminSave()"><input value="${esc(c.emoji)}" maxlength="4" onchange="admin.characters[${i}].emoji=this.value;maybeAdminSave()"></div><div><input type="file" accept="image/*" onchange="setCharImage(${i},this.files[0])"><button class="btn danger" onclick="admin.characters[${i}].image='';maybeAdminSave();openAdminRefresh()">画像解除</button></div></div>`}function adminRoulette(r,i){return `<div class="adminItem"><div>${r.image?`<img class="thumb" src="${r.image}">`:`<b>${esc(r.label)}</b>`}</div><div><label>表示<input value="${esc(r.label)}" onchange="admin.roulette[${i}].label=this.value;maybeAdminSave()"></label><label>色<select onchange="admin.roulette[${i}].color=this.value;maybeAdminSave()"><option ${r.color==='PINK'?'selected':''}>PINK</option><option ${r.color==='AQUA'?'selected':''}>AQUA</option></select></label><label>組<select onchange="admin.roulette[${i}].group=this.value;maybeAdminSave()"><option ${r.group==='LOW'?'selected':''}>LOW</option><option ${r.group==='HIGH'?'selected':''}>HIGH</option></select></label></div><div><input type="file" accept="image/*" onchange="setRouletteImage(${i},this.files[0])"><button class="btn danger" onclick="admin.roulette[${i}].image='';maybeAdminSave();openAdminRefresh()">画像解除</button></div></div>`}function closeAdmin(){$('#adminOverlay')?.remove()}function openAdminRefresh(){closeAdmin();openAdmin()}function testAdminLogin(){let p=prompt('現在の管理パスワードを入力');alert(p===admin.password?'ログイン動作は正常です':'パスワードが違います')}async function compressImage(file){if(!file)return'';let bmp=await createImageBitmap(file),scale=Math.min(1,admin.imageMax/Math.max(bmp.width,bmp.height)),w=Math.round(bmp.width*scale),h=Math.round(bmp.height*scale),cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(bmp,0,0,w,h);return cv.toDataURL(file.type==='image/png'?'image/png':'image/webp',admin.imageQuality)}async function setCharImage(i,f){admin.characters[i].image=await compressImage(f);maybeAdminSave();openAdminRefresh()}async function setRouletteImage(i,f){admin.roulette[i].image=await compressImage(f);maybeAdminSave();openAdminRefresh()}async function setBackground(f){admin.background=await compressImage(f);maybeAdminSave();openAdminRefresh()}function moveGame(i,d){let j=i+d;if(j<0||j>=admin.games.length)return;[admin.games[i],admin.games[j]]=[admin.games[j],admin.games[i]];maybeAdminSave();openAdminRefresh()}function exportJSON(){adminSave();download('MARINE_TRICK_ARCADE_backup.json',JSON.stringify({version:2,admin,state},null,2),'application/json')}function importJSON(f){if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(x.admin)admin=Object.assign(defaults(),x.admin);if(x.state)state=x.state;adminSave();openAdminRefresh();alert('JSONを読み込みました')}catch(e){alert('JSONを読み込めませんでした')}};r.readAsText(f)}function download(name,text,type){let b=new Blob([text],{type}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function encodeUTF8(s){let bytes=new TextEncoder().encode(s),bin='';for(let i=0;i<bytes.length;i+=8192)bin+=String.fromCharCode(...bytes.subarray(i,i+8192));return btoa(bin)}function minifyHTML(s){return s.replace(/<!--[^]*?-->/g,'').replace(/>\s+</g,'><').trim()}function buildPublicHTML(){let clone=document.documentElement.cloneNode(true);clone.querySelectorAll('[data-master],#admin-script,#master-config,#adminOverlay').forEach(e=>e.remove());let runtime=clone.querySelector('#public-runtime');let code=runtime.textContent;runtime.remove();clone.querySelector('#home').classList.remove('hidden');clone.querySelector('#screen').classList.add('hidden');clone.querySelector('#screen').innerHTML='';let boot=document.createElement('script'),data=JSON.stringify(publicData()).replace(/</g,'\\u003c'),encoded=encodeUTF8(code);boot.textContent=`window.__PUBLIC__=${data};Function(new TextDecoder().decode(Uint8Array.from(atob('${encoded}'),c=>c.charCodeAt(0))))();`;clone.body.appendChild(boot);return '<!doctype html>'+minifyHTML(clone.outerHTML)}function exportPublic(){adminSave();let html=buildPublicHTML();download('index.html',html,'text/html');let checks=verifyPublicSource(html);if(checks.ok)alert(`index.htmlを書き出しました\n管理情報除去：OK\n単一HTML：OK\nサイズ：${Math.round(html.length/1024)}KB`);else alert('書き出しましたが検査に失敗：'+checks.errors.join(' / '))}function verifyPublicSource(html){let errors=[];['3103','adminLogin','管理パスワード','JSON書き出し','exportPublic','mta-admin-v2'].forEach(x=>{if(html.includes(x))errors.push(x+' が残っています')});if(!html.includes('window.__PUBLIC__'))errors.push('公開データなし');if(!html.includes('data:image/webp;base64'))errors.push('ディーラー画像なし');return{ok:!errors.length,errors}}admin.cards||={backImage:'',frontImage:'',centerNumbers:true};
if(!admin.games.some(g=>g.id==='poker'))admin.games.push({id:'poker',name:'MARINE POKER',icon:'♦️',desc:'5枚から役を作るドローポーカー'});
function publicData(){return{background:admin.background||'',allowPublicImageSave:!!admin.allowPublicImageSave,dealerImage:admin.dealerImage,characters:admin.characters.map(({name,emoji,image})=>({name,emoji,image})),games:admin.games.map(({id,name,icon,desc})=>({id,name,icon,desc})),roulette:admin.roulette.map(({label,image,color,group})=>({label,image,color,group})),cards:{backImage:admin.cards.backImage||'',frontImage:admin.cards.frontImage||'',centerNumbers:admin.cards.centerNumbers!==false}}}
const openAdminV2=openAdmin;
openAdmin=function(){openAdminV2();let host=$('#adminOverlay .adminBox'),section=document.createElement('section');section.className='panel';section.innerHTML=`<h3>トランプ共通デザイン</h3><div class="adminGrid"><label>カード裏面画像<input type="file" accept="image/*" onchange="setCardImage('backImage',this.files[0])"></label><label>カード表面キャラクター<input type="file" accept="image/*" onchange="setCardImage('frontImage',this.files[0])"></label><label><input type="checkbox" ${admin.cards.centerNumbers?'checked':''} onchange="admin.cards.centerNumbers=this.checked;maybeAdminSave()"> 中央にも数字を表示</label></div><div class="row">${admin.cards.backImage?`<img class="thumb" src="${admin.cards.backImage}">`:''}${admin.cards.frontImage?`<img class="thumb" src="${admin.cards.frontImage}">`:''}<button class="btn danger" onclick="admin.cards.backImage='';admin.cards.frontImage='';maybeAdminSave();openAdminRefresh()">カード画像解除</button></div><p class="muted">角2か所の数字とスートは常に表示されます。</p>`;host.insertBefore(section,host.lastElementChild)};
async function setCardImage(key,file){admin.cards[key]=await compressImage(file);maybeAdminSave();openAdminRefresh()}
Object.assign(window,{setCardImage});

syncConfig();</script></body></html>
